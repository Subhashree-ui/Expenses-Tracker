<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            margin: 0;
            padding: 40px 0;
            background-color: rgb(215, 236, 250);
        }
        .box{
            width: 400px; ;
            padding: 25px; ;
            border-radius: 10px ;
            background-color:white ;
            box-shadow:  0 5px 20px rgba(0,0,0,0.1);
        }
        h1{
            text-align: center;
            font-size: 30px;
            margin-top: 0;
        }
        input{
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            font-size: 15px;
            border: 2px solid #ddd ;
            border-radius: 5px;
            box-sizing: border-box;
        }
        #addBtn {
            font-size: 20px;
            width: 100%;
            padding: 12px;
            background-color: #f69840;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        #expenseList{
            list-style: none;
            padding: 0;
            margin: 20px 0;
        }
        #total{
            font-size: 20px;
            font-weight: bold;
            text-align: right;
        }
        #expenseList li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom:1px solid #eee;
        }

    </style>
</head>
<body>
    <div class="box">
        <h1>Expense Tracker</h1>
        <input type="text" id="nameInput" placeholder=" What did you spend on  ?">
        <input type="number" id="amountInput" placeholder="Amount">
        <button id="addBtn"> Add Expense</button>

        <ul id="expenseList"></ul>
        <p id="total"> Total: 0 </p>
    </div>
<script>
    let nameInput = document.getElementById("nameInput");
    let amountInput = document.getElementById("amountInput");       
    let addBtn = document.getElementById("addBtn")   ;
    let expenseList = document.getElementById("expenseList") ;
    let totalDisplay = document.getElementById("total");

    let expenses =JSON.parse(localStorage.getItem ("expenses")) || [];
    function saveExpenses(){
        localStorage.setItem("expenses" ,JSON.stringify(expenses));
    }
    function renderExpense(){
        expenseList.innerHTML = "";

        expenses.forEach(function(expense,index){
            let li= document.createElement("li");
            li.textContent = expense.name + "-"+ expense.amount;

            let deleteBtn = document.createElement("button");
            deleteBtn.textContent ="delete";

            deleteBtn.addEventListener("click", function(){
                expenses.splice(index,1);
                saveExpenses();
                renderExpense();
            });
                li.appendChild(deleteBtn);
                expenseList.appendChild(li);
        });
        let total = expenses.reduce(function(sum,expense){
            return sum + expense.amount;
        }, 0);

        totalDisplay.textContent = "Total:" + total;
    }
    addBtn.addEventListener("click", function(){
        let name = nameInput.value;
        let amount = Number(amountInput.value);

        if (name === "" || amount === 0){
            alert("Please enter name and amount");
            return;
        }
        expenses.push({name:name , amount:amount});
        saveExpenses();
        renderExpense();

        nameInput.value ="";
        amountInput.value ="";
    });
    renderExpense();

</script>
</body>
</html>
